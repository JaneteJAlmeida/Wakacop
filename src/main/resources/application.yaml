server:
  servlet:
    context-path: /wakacop
spring:
  datasource:
    url: jdbc:h2:mem:wakacopdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

  logging:
    level:
      academy.wakanda: ${LOG_LEVEL:DEBUG}